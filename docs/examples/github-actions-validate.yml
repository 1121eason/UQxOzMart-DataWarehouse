# Optional template. Copy to .github/workflows/validate.yml to enable.
name: Validate portfolio

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portable-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify source artifacts and local links
        run: python scripts/verify_repository.py
      - name: Run synthetic warehouse and six analyses
        run: python scripts/run_demo.py
      - name: Check analytical behaviour and invalid inputs
        run: python -m unittest discover -s tests -v
